get:
  name: 手动拉取节假日
  description: 立即重新请求节假日数据并刷新传感器。只更新放假安排缓存，不会修改纪念日，也不会写入卡片里新增的纪念日。
  target:
    entity:
      domain: sensor
      integration: chineseholiday
  fields:
    force:
      name: 忽略缓存
      description: 开启后忽略 15 天缓存，马上重新请求。默认开启。
      default: true
      required: false
      example: true
      selector:
        boolean:
